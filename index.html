<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RISMA Standings</title>
<meta name="description" content="RISMA Pop Warner football standings and scores, updated from the conference score sheet.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Public+Sans:wght@400;500;600&display=swap">
<style>
:root {
  --bg: #f5f4f8; --surface: #ffffff; --fg: #1d1925; --muted: #6a6478; --line: #e3e0ea;
  --accent: #5b2d92; --accent-soft: #efe8f8; --on-accent: #ffffff; --gold: #f0b323; --gold-strong: #d99a0b; --on-gold: #241a00; --warn-bg: #fff4dc; --warn-fg: #6b4a00;
  --font-display: "Barlow Condensed", "Arial Narrow", Arial, sans-serif;
  --font-body: "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #131117; --surface: #1c1922; --fg: #ece9f2; --muted: #a29bb0; --line: #2e2a37;
    --accent: #b591ef; --accent-soft: #2a2238; --on-accent: #16121c; --gold: #f5c542; --gold-strong: #ffd666; --on-gold: #1f1600; --warn-bg: #3a2f14; --warn-fg: #f3d58a;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.45; }
.wrap {
  max-width: 600px; margin: 0 auto; padding-block: 20px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 22px;
}
.wrap > * { min-width: 0; }
.wrap.wide { max-width: 1080px; }
header { display: grid; gap: 4px; }
.eyebrow { font-family: var(--font-display); font-weight: 600; font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); }
h1 { font-family: var(--font-display); font-weight: 700; font-size: 34px; line-height: 1; margin: 0; }
.updated { color: var(--muted); font-size: 13px; }
.banner { background: var(--warn-bg); color: var(--warn-fg); border-radius: 10px; padding: 10px 14px; font-size: 13.5px; }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; }
.tab { font-family: var(--font-display); font-weight: 600; font-size: 17px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 999px; padding: 6px 15px; cursor: pointer; white-space: nowrap; }
.tab[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.tab:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h2 { font-family: var(--font-display); font-weight: 700; font-size: 20px; letter-spacing: .04em; text-transform: uppercase; margin: 0 0 8px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.scroll { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th { font-family: var(--font-display); font-weight: 600; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); text-align: right; padding: 9px 7px; border-bottom: 1px solid var(--line); }
th:first-child, td:first-child { text-align: left; padding-left: 12px; }
th:last-child, td:last-child { padding-right: 12px; }
th[data-sort] { cursor: pointer; user-select: none; }
#secStand th:first-child, #secStand td:first-child { position: sticky; left: 0; z-index: 2; background: var(--surface); box-shadow: 6px 0 6px -6px rgba(0,0,0,.25); }
#secStand tbody tr:hover td:first-child, #secStand tbody tr.sel td:first-child { background: var(--accent-soft); }
th[aria-sort="ascending"] .h::before, th[aria-sort="descending"] .h::before { color: var(--accent); margin-right: 2px; }
th[aria-sort="ascending"] .h::before { content: "▲"; font-size: 9px; }
th[aria-sort="descending"] .h::before { content: "▼"; font-size: 9px; }
th[aria-sort="ascending"], th[aria-sort="descending"] { color: var(--accent); }
.note strong { color: var(--fg); font-weight: 600; }
.h { position: relative; cursor: pointer; border-bottom: 1px dotted var(--muted); outline: none; }
.h:focus-visible { color: var(--accent); }
.h::after {
  content: attr(data-tip); display: none; position: absolute; top: calc(100% + 8px); left: 0; z-index: 5;
  width: max-content; max-width: 190px; padding: 8px 10px; border-radius: 8px;
  background: var(--fg); color: var(--bg); box-shadow: 0 4px 14px rgba(0,0,0,.18);
  font-family: var(--font-body); font-size: 12.5px; font-weight: 500; line-height: 1.35;
  letter-spacing: normal; text-transform: none; text-align: left; white-space: normal;
}
th:nth-last-child(-n+5) .h::after { left: auto; right: -4px; }
.h:hover::after, .h:focus::after { display: block; }
td { padding: 10px 7px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
tbody tr { cursor: pointer; }
tbody tr:hover td, tbody tr.sel td { background: var(--accent-soft); }
tbody tr:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.rank { color: var(--muted); display: inline-block; width: 1.5em; }
.team { font-weight: 600; }
.mark { color: var(--accent); font-weight: 700; margin-left: 2px; }
td.pts { font-family: var(--font-display); font-weight: 700; font-size: 18px; color: var(--accent); }
.notes { display: grid; gap: 4px; margin: 8px 2px 0; }
.note { color: var(--muted); font-size: 12.5px; margin: 0; }
.weeks { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
.wk { font-size: 15px; padding: 4px 11px; }
.games { display: grid; gap: 8px; }
.game { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; display: grid; grid-template-columns: 1fr auto; row-gap: 4px; padding: 10px 14px; }
.game .wkl { grid-column: 1 / -1; font-size: 12px; color: var(--muted); }
.side { display: contents; }
.side .nm { min-width: 0; display: flex; align-items: center; }
.side .sc { font-family: var(--font-display); font-weight: 700; font-size: 20px; text-align: right; font-variant-numeric: tabular-nums; line-height: 1.1; }
.side.win .nm { font-weight: 600; }
.side.lose .nm, .side.lose .sc { color: var(--muted); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--surface); justify-self: start; }
.seg button { font-family: var(--font-display); font-weight: 600; font-size: 16px; letter-spacing: .02em; border: 0; background: none; color: var(--muted); padding: 8px 16px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }
.seg button.gold, .seg button.gold[aria-pressed="true"] { background: var(--gold); color: var(--on-gold); font-weight: 700; display: inline-flex; align-items: center; gap: 7px; }
.seg button.gold[aria-pressed="true"] { box-shadow: inset 0 -3px 0 var(--gold-strong); }
.seg button.gold .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--on-gold); opacity: .8; }
.seg button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
#secPlayoffs { display: grid; gap: 14px; }
#secPlayoffs[hidden] { display: none; }
#secPlayoffs h2 { margin: 0; }
.seeds { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
.seedrow { display: flex; gap: 8px; align-items: center; padding: 9px 12px; border-bottom: 1px solid var(--line); font-weight: 600; min-width: 0; }
.seedrow > span:nth-child(2) { display: flex; align-items: center; min-width: 0; }
.seedrow .mark { margin-left: -2px; }
.seedrow.out { color: var(--muted); font-weight: 500; grid-column: 1 / -1; }
.seedrow.out img, .seedrow.out .logo { opacity: .5; }
.seedrow.out .tag { grid-column: auto; flex-shrink: 0; margin-left: auto; color: var(--muted); font-weight: 500; white-space: nowrap; }
.seed { font-family: var(--font-display); font-weight: 700; color: var(--accent); min-width: 1.8em; font-variant-numeric: tabular-nums; line-height: 1; }
.round { display: grid; gap: 8px; }
.round h3 { font-family: var(--font-display); font-weight: 700; font-size: 18px; letter-spacing: .04em; text-transform: uppercase; margin: 4px 0 0; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.round h3 span { font-family: var(--font-body); font-size: 12.5px; font-weight: 500; letter-spacing: normal; text-transform: none; color: var(--muted); }
.pgame { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; display: grid; gap: 4px; }
.pt { display: grid; grid-template-columns: 2.2em 1fr auto; align-items: center; gap: 6px; }
.pt .nm { min-width: 0; display: flex; align-items: center; }
.pt .sc { font-family: var(--font-display); font-weight: 700; font-size: 20px; font-variant-numeric: tabular-nums; }
.pt.win .nm { font-weight: 700; }
.pt.lose .nm, .pt.lose .sc { color: var(--muted); }
.logo { width: 22px; height: 22px; border-radius: 50%; flex: none; display: inline-block; vertical-align: middle; margin-right: 8px; box-shadow: 0 0 0 1px var(--line); background: #fff; object-fit: cover; }
.ini { background: var(--accent-soft); color: var(--accent); font-size: 9.5px; font-weight: 700; line-height: 22px; text-align: center; vertical-align: middle; }
.bg .logo { width: 18px; height: 18px; margin-right: 6px; }
.bg .ini { line-height: 18px; font-size: 8px; }
.extra { font-weight: 600; }
.tbd { color: var(--muted); font-style: italic; }
.pnote { font-size: 12px; color: var(--muted); }
.bwrap { overflow-x: auto; margin-inline: -4px; padding: 4px; }
.bracket { --cols: 3; position: relative; display: grid; grid-template-columns: repeat(var(--cols), minmax(0, 1fr)); column-gap: 24px; width: 100%; min-width: calc(var(--cols) * 180px + (var(--cols) - 1) * 24px); }
.bcol { display: flex; flex-direction: column; gap: 8px; }
.bhead { font-family: var(--font-display); font-weight: 700; font-size: 15px; letter-spacing: .05em; text-transform: uppercase; display: grid; }
.bhead span { font-family: var(--font-body); font-size: 11.5px; font-weight: 500; letter-spacing: normal; text-transform: none; color: var(--muted); }
.bgames { flex: 1; display: flex; flex-direction: column; justify-content: space-around; gap: 14px; }
.bg { position: relative; z-index: 1; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 7px 9px; display: grid; gap: 2px; font-size: 13px; }
.bg .pt { grid-template-columns: 1.9em minmax(0, 1fr) auto; }
.bg .nm { min-width: 0; }
.bg .sc { font-size: 16px; }
.bg .pnote { font-size: 11.5px; line-height: 1.35; }
.swipe { display: none; font-size: 12.5px; color: var(--accent); font-weight: 600; margin: 0 2px; }
@media (max-width: 560px) { .swipe { display: block; } }
.blines { position: absolute; inset: 0; pointer-events: none; overflow: visible; }
.blines path { fill: none; stroke: var(--muted); stroke-opacity: .55; stroke-width: 1.5; }
.h2date { font-family: var(--font-body); font-size: 13px; font-weight: 500; letter-spacing: normal; text-transform: none; color: var(--muted); margin-left: 10px; }
.round h3 { margin-top: 10px; }
.sechead { font-family: var(--font-display); font-weight: 700; font-size: 15px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 4px 0 -4px; }
.divider { border: 0; border-top: 2px solid var(--line); margin: 10px 0 2px; width: 100%; }
body.po-mode header h1 { text-decoration: underline; text-decoration-color: var(--gold); text-decoration-thickness: 6px; text-underline-offset: 7px; margin-bottom: 10px; }
.champ { background: var(--accent); color: var(--on-accent); border-radius: 10px; padding: 14px 16px; font-family: var(--font-display); font-weight: 700; font-size: 22px; letter-spacing: .03em; text-transform: uppercase; }
.tag { grid-column: 1 / -1; font-size: 12px; color: var(--accent); font-weight: 600; }
.empty { background: var(--surface); border: 1px dashed var(--line); border-radius: 10px; padding: 14px; color: var(--muted); }
.filter { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 8px; }
.filter h2 { margin: 0; }
.clear { background: none; border: 0; color: var(--accent); font: inherit; font-weight: 600; cursor: pointer; padding: 4px; }
.clear:focus-visible { outline: 2px solid var(--accent); border-radius: 4px; }
footer { color: var(--muted); font-size: 12.5px; border-top: 1px solid var(--line); padding-top: 14px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">RISMA Pop Warner · 2026 Football</div>
    <h1 id="title">Standings &amp; Scores</h1>
    <div class="updated" id="updated">Loading scores…</div>
  </header>
  <div class="banner" id="banner" hidden></div>
  <div class="seg" id="mode" role="group" aria-label="View">
    <button data-m="season" aria-pressed="true">Regular season</button>
    <button data-m="playoffs" class="gold" aria-pressed="false"><span class="dot" aria-hidden="true"></span>Playoffs</button>
  </div>
  <div class="seg" id="pview" role="group" aria-label="Playoff view" hidden>
    <button data-v="age" aria-pressed="true">By age group</button>
    <button data-v="round" aria-pressed="false">By round</button>
  </div>
  <div class="tabs" id="rounds" role="group" aria-label="Round" hidden></div>
  <div class="tabs" id="divs" role="group" aria-label="Division"></div>
  <section id="secPlayoffs" hidden></section>
  <section id="secStand">
    <div class="filter">
      <h2 id="standTitle">Standings</h2>
      <button class="clear" id="resetSort" hidden>Back to standings order</button>
    </div>
    <div class="panel scroll">
      <table>
        <thead><tr>
          <th data-sort="team"><span class="h" tabindex="0" data-tip="Tap a team name to see all of its games.">Team</span></th>
          <th data-sort="w"><span class="h" tabindex="0" data-tip="Wins">W</span></th>
          <th data-sort="l"><span class="h" tabindex="0" data-tip="Losses (forfeits count as losses)">L</span></th>
          <th data-sort="tie"><span class="h" tabindex="0" data-tip="Ties">T</span></th>
          <th data-sort="gp"><span class="h" tabindex="0" data-tip="Games played">GP</span></th>
          <th data-sort="pts"><span class="h" tabindex="0" data-tip="Standings points: 2 for a win, 1 for a tie, minus any forfeit penalties">Pts</span></th>
          <th data-sort="pct"><span class="h" tabindex="0" data-tip="Percentage of potential points: points earned divided by points possible (2 per game played). Teams are ranked by this.">Pct</span></th>
          <th data-sort="pf"><span class="h" tabindex="0" data-tip="Points for: total points scored">PF</span></th>
          <th data-sort="pa"><span class="h" tabindex="0" data-tip="Points against: total points allowed">PA</span></th>
        </tr></thead>
        <tbody id="standings"></tbody>
      </table>
    </div>
    <div class="notes" id="notes"></div>
  </section>
  <section id="secGames">
    <div class="filter">
      <h2 id="resultsTitle">Results</h2>
      <button class="clear" id="clearTeam" hidden>Show all teams</button>
    </div>
    <div class="weeks" id="weeks" role="group" aria-label="Week"></div>
    <div class="games" id="games"></div>
  </section>
  <footer>Scores come straight from the RISMA score sheet. Records, points and order are calculated automatically.</footer>
</div>

<script>
/* ===== Settings ===== */
// Paste the "Publish to web" CSV links for each tab here.
const SCORES_CSV = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSA4w1w1Kp4znLB4vXW29dcf8FhMSEU0ZEHwSCvBUtxpXnHBSPnwHh4z1NKLBP4Tk6y2ZZNufKmSmvN/pub?gid=961213480&single=true&output=csv";
const ADJUSTMENTS_CSV = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSA4w1w1Kp4znLB4vXW29dcf8FhMSEU0ZEHwSCvBUtxpXnHBSPnwHh4z1NKLBP4Tk6y2ZZNufKmSmvN/pub?gid=927064909&single=true&output=csv";
const SEEDS_CSV = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSA4w1w1Kp4znLB4vXW29dcf8FhMSEU0ZEHwSCvBUtxpXnHBSPnwHh4z1NKLBP4Tk6y2ZZNufKmSmvN/pub?gid=1670446849&single=true&output=csv";
const SETTINGS_CSV = "";
// Everything from here to the forfeit rules can also be set on the sheet's Settings tab, which wins when it's filled in.
// These built-in values are used when the Settings tab is missing or can't be reached.
let SHOW_PLAYOFFS = true;
// Playoffs: games entered on the Scores tab with these week numbers are playoff games.
const ROUNDS = { 9: "First round", 10: "Semifinals", 11: "Super Bowl" };
let ROUND_DATES = { 9: "Sat, Oct 24", 10: "Sun, Nov 1", 11: "Sun, Nov 8 (tentative) · Location to be announced" };
// Shown on a game card until its own row (with time and field) is on the Scores tab.
let ROUND_INFO = { 10: {
  "8U": "Sun 11/1 · 11:00 AM · at Dartmouth or Middletown",
  "10U": "Sun 11/1 · 12:30 PM · at Dartmouth or Middletown",
  "12U": "Sun 11/1 · 2:00 PM at Dartmouth or 3:30 PM at Middletown",
  "13U": "Sun 11/1 · 3:30 PM at Dartmouth or 2:00 PM at Middletown" },
  11: { "*": "Sun 11/8 (tentative) · Time and location to be announced" } };
// Divisions without a playoff bracket, and other events shown on a round page.
let NO_PLAYOFFS = ["6U"];
let ROUND_EXTRAS = { 10: "6U Bowl: Sun 11/1 · 9:00–11:00 AM · at Dartmouth" };
let SEED_NOTES = {
  "8U": "#3 to #5: Dartmouth, New Bedford and East Providence tied at .571, and the conference set the order by coin flip. #6: Dighton-Rehoboth and Wareham tied for the last spot, and Wareham won the play-in game 31-12 on Wed 10/21.",
  "12U": "#3 to #5: Dartmouth, Old Rochester and New Bedford tied at .714. Old Rochester and Dartmouth never played each other, so head-to-head can't settle it, and the conference set the order by coin flip.",
  "13U": "13U has one regular-season make-up game left (East Providence at East Bay, Sat 10/24, 6:30 PM). Either result leaves these four seeds in the same order." };
// Notes shown under each division's standings.
let STANDINGS_NOTES = {
  "6U": "6U is non-competitive: no playoff bracket and no forfeit penalties. The 6U Bowl is Sun 11/1, 9:00 to 11:00 AM at Dartmouth.",
  "8U": "Dartmouth, New Bedford and East Providence finished tied at .571. Not all three played each other, so the conference set the order by coin flip: Dartmouth #3, New Bedford #4, East Providence #5. Dighton-Rehoboth and Wareham tied at .429 for the last playoff spot, and Wareham won the play-in game 31-12.",
  "10U": "No ties among the top six. Seeds follow the standings: Dartmouth, Seekonk, Wareham, Fairhaven, East Providence, Edgewood.",
  "12U": "Dartmouth, Old Rochester and New Bedford finished tied at .714. Old Rochester and Dartmouth never played each other, so the conference set the order by coin flip: Dartmouth #3, Old Rochester #4, New Bedford #5.",
  "13U": "One game left: East Providence at East Bay, Sat 10/24, 6:30 PM (make-up of the Week 3 rainout). Either result leaves the top four in the same order." };
// How many teams make the playoffs (used only until seeds are entered on the Seeds tab).
let PLAYOFF_TEAMS = { "13U": 4, default: 6 };
let START_VIEW = "playoffs";   // "season" or "playoffs"
// Teams that are not RISMA members. Their games count for the RISMA team but they get no standings row.
const NON_MEMBERS = ["Mt. Hope"];
const DIV_ORDER = ["6U", "8U", "10U", "12U", "13U", "14U"];
// Conference rule: a forfeit is a loss for the team that forfeited, and every OTHER competitive team
// from that organization loses 1 point. A game can be excused by setting "Org penalty" to No.
const FORFEIT_PENALTY = -1;
const PENALTY_INCLUDES_FORFEITING_TEAM = false;
// Non-competitive divisions never lose points and their forfeits don't penalize other teams.

function parseCSV(text) {
  const rows = []; let row = [], f = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i+1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"') q = true;
    else if (c === ",") { row.push(f); f = ""; }
    else if (c === "\n" || c === "\r") { if (c === "\r" && text[i+1] === "\n") i++; row.push(f); rows.push(row); row = []; f = ""; }
    else f += c;
  }
  if (f !== "" || row.length) { row.push(f); rows.push(row); }
  const head = (rows.shift() || []).map(h => h.trim().toLowerCase());
  return rows.filter(r => r.some(v => v.trim() !== "")).map(r => Object.fromEntries(head.map((h, i) => [h, (r[i] || "").trim()])));
}
const num = v => v === "" || v == null || isNaN(+v) ? null : +v;

function build(scoresText, adjText, seedsText) {
  const games = {}, byes = {}, weekNotes = {}, adj = {}, playoffs = {}, seeds = {};
  const add = (o, d) => (o[d] ??= []);
  for (const r of parseCSV(scoresText)) {
    const d = r["division"], w = num(r["week"]);
    if (!d || w == null) continue;
    const a = r["team 1"], b = r["team 2"], sa = num(r["score 1"]), sb = num(r["score 2"]), note = r["notes"] || "";
    if (ROUNDS[w]) { if (a && b) add(playoffs, d).push({ w, a, sa, b, sb, ff: r["forfeit by"] || "", note }); continue; }
    if (a && b && sa != null && sb != null) add(games, d).push({ w, a, sa, b, sb, ff: r["forfeit by"] || "", penalty: !/^no$/i.test(r["org penalty"] || "") });
    else if (/^bye$/i.test(note) && a) ((byes[d] ??= {})[w] ??= []).push(a);
    else if (note) ((weekNotes[d] ??= {})[w] ??= []).push(note);
  }
  for (const r of parseCSV(adjText || "")) {
    const d = r["division"], t = r["team"], p = num(r["points"]);
    if (!d || !t || p == null) continue;
    const k = d + "|" + t; adj[k] ??= { pts: 0, reasons: [] }; adj[k].pts += p; if (r["reason"]) adj[k].reasons.push(r["reason"]);
  }
  const divs = Object.keys(games).sort((x, y) => {
    const ix = DIV_ORDER.indexOf(x), iy = DIV_ORDER.indexOf(y);
    return (ix < 0 ? 99 : ix) - (iy < 0 ? 99 : iy) || x.localeCompare(y, undefined, { numeric: true });
  });
  // Forfeit penalties, applied to every division where the forfeiting organization has a team
  for (const d of divs) for (const g of games[d]) {
    if (!g.ff || !g.penalty || NON_COMPETITIVE.includes(d)) continue;
    for (const d2 of divs) {
      if (d2 === d && !PENALTY_INCLUDES_FORFEITING_TEAM) continue;
      if (NON_COMPETITIVE.includes(d2)) continue;
      if (!games[d2].some(x => x.a === g.ff || x.b === g.ff)) continue;
      const k = d2 + "|" + g.ff; adj[k] ??= { pts: 0, reasons: [] };
      adj[k].pts += FORFEIT_PENALTY; adj[k].reasons.push(`Forfeit penalty (${d} forfeit, Week ${g.w})`);
    }
  }
  for (const r of parseCSV(seedsText || "")) {
    const d = r["division"], s = num(r["seed"]), t = r["team"];
    if (d && s != null && t) add(seeds, d).push({ seed: s, team: t, note: r["notes"] || "" });
  }
  for (const d in seeds) seeds[d].sort((x, y) => x.seed - y.seed);
  return { games, byes, weekNotes, adj, divs, playoffs, seeds };
}

/* Settings tab: columns Setting, Division, Value. A setting that has rows on the tab replaces the built-in value,
   so deleting a note's row removes that note. */
function applySettings(text) {
  const rows = parseCSV(text || "").map(r => ({ s: (r["setting"] || "").toLowerCase(), d: r["division"] || "", v: r["value"] || "" }));
  if (!rows.length) return;
  const get = name => rows.filter(r => r.s === name);
  const one = name => { const r = get(name).find(r => r.v !== ""); return r ? r.v : null; };
  const sp = one("show playoffs"); if (sp != null) SHOW_PLAYOFFS = /^(yes|y|on|true)$/i.test(sp);
  const ov = one("open on"); if (ov != null) START_VIEW = /play/i.test(ov) ? "playoffs" : "season";
  [[9, "first round"], [10, "semifinal"], [11, "super bowl"]].forEach(([w, n]) => {
    const dt = one(n + " date"); if (dt != null) ROUND_DATES[w] = dt;
    const t = get(n + " time");
    if (t.length) { ROUND_INFO[w] = {}; t.forEach(r => { if (r.v) ROUND_INFO[w][r.d || "*"] = r.v; }); }
    const x = get(n + " extra line");
    if (x.length) { const v = x.map(r => r.v).filter(Boolean).join(" · "); if (v) ROUND_EXTRAS[w] = v; else delete ROUND_EXTRAS[w]; }
  });
  const loc = one("super bowl location");
  if (loc != null) ROUND_DATES[11] = ROUND_DATES[11].split(" · ")[0] + " · " + loc;
  const pt = get("playoff teams");
  if (pt.length) {
    PLAYOFF_TEAMS = { default: 6 }; NO_PLAYOFFS = [];
    pt.forEach(r => {
      const n = parseInt(r.v, 10) || 0;
      if (!r.d) { if (n > 0) PLAYOFF_TEAMS.default = n; }
      else if (n > 0) PLAYOFF_TEAMS[r.d] = n; else NO_PLAYOFFS.push(r.d);
    });
  }
  const notes = name => { const rs = get(name); if (!rs.length) return null; const o = {}; rs.forEach(r => { if (r.d && r.v) o[r.d] = r.v; }); return o; };
  STANDINGS_NOTES = notes("standings note") || STANDINGS_NOTES;
  SEED_NOTES = notes("seeding note") || SEED_NOTES;
}

let D, div, week, team = null, lastWeek = 1, mode = START_VIEW, sortCol = null, sortDir = "desc";

function standings(d) {
  const t = {}, row = k => (t[k] ??= { k, w:0, l:0, tie:0, pf:0, pa:0 });
  for (const g of D.games[d]) for (const [x, s, o] of [[g.a, g.sa, g.sb], [g.b, g.sb, g.sa]]) {
    if (NON_MEMBERS.includes(x)) continue;
    const r = row(x); r.pf += s; r.pa += o;
    if (s > o) r.w++; else if (s < o) r.l++; else r.tie++;
  }
  const rows = Object.values(t).map(r => {
    const a = D.adj[d + "|" + r.k], gp = r.w + r.l + r.tie, pts = 2*r.w + r.tie + (a ? a.pts : 0);
    return { ...r, adj: a ? a.pts : 0, reasons: a ? a.reasons : [], gp, pts, pct: gp ? pts / (2 * gp) : 0, coin: false };
  });
  // Rank by share of possible points (teams have played different numbers of games),
  // then head-to-head among the tied teams, then a coin flip (shown as a tie).
  const key = r => Math.round(r.pct * 1e6);
  rows.sort((x, y) => key(y) - key(x) || x.k.localeCompare(y.k));
  const out = [];
  for (let i = 0; i < rows.length;) {
    let j = i; while (j < rows.length && key(rows[j]) === key(rows[i])) j++;
    const grp = rows.slice(i, j);
    if (grp.length > 1) {
      const names = new Set(grp.map(r => r.k)), h2h = Object.fromEntries(grp.map(r => [r.k, 0]));
      for (const g of D.games[d]) if (names.has(g.a) && names.has(g.b) && g.sa !== g.sb) {
        h2h[g.sa > g.sb ? g.a : g.b]++; h2h[g.sa > g.sb ? g.b : g.a]--;
      }
      // Head-to-head only counts when every tied team has played every other tied team.
      const met = (x, y) => D.games[d].some(g => (g.a === x && g.b === y) || (g.a === y && g.b === x));
      const allMet = grp.every((x, i) => grp.every((y, j) => i === j || met(x.k, y.k)));
      if (allMet) {
        grp.sort((x, y) => h2h[y.k] - h2h[x.k] || x.k.localeCompare(y.k));
        for (let a = 0; a < grp.length; a++) for (let b = 0; b < grp.length; b++)
          if (a !== b && h2h[grp[a].k] === h2h[grp[b].k]) grp[a].coin = true;
      } else grp.forEach(r => r.coin = true);
      const seedOf = k => (D.seeds?.[d] || []).find(x => x.team === k)?.seed ?? 99;
      if (grp.some(r => r.coin)) grp.sort((x, y) => (x.coin && y.coin ? seedOf(x.k) - seedOf(y.k) : 0) || 0);
    }
    out.push(...grp); i = j;
  }
  return out;
}

const pctText = p => (p < 0 ? "-" : "") + (Math.abs(p) >= 1 ? "1.000" : Math.abs(p).toFixed(3).slice(1));
const logo = t => LOGOS[t]
  ? `<img class="logo" src="${LOGOS[t]}" alt="" width="22" height="22">`

function renderTabs() {

  document.getElementById("standings").innerHTML = rows.map(r =>
    `<tr data-k="${esc(r.k)}" class="${team === r.k ? "sel" : ""}" tabindex="0">
      <td><span class="rank">${r.rank}</span>${logo(r.k)}<span class="team">${esc(r.k)}</span>${r.adj ? `<span class="mark">*</span>` : ""}${r.coin ? `<span class="mark">†</span>` : ""}</td>
      <td>${r.w}</td><td>${r.l}</td><td>${r.tie}</td><td>${r.gp}</td><td>${r.pts}</td>
      <td class="pts">${pctText(r.pct)}</td><td>${r.pf}</td><td>${r.pa}</td></tr>`).join("");
  const notes = ["Tap a column heading to sort by it and see what it means. The number on the left is always the standings position, ranked by Pct (percentage of potential points), because some teams have played more games than others. Tap a team to see its games."];
  if (STANDINGS_NOTES[div]) notes.unshift(`<strong>${esc(STANDINGS_NOTES[div])}</strong>`);
  if (rows.some(r => r.coin)) notes.push("† Tied on Pct. Head-to-head breaks a tie only when all the tied teams played each other; otherwise the conference decides the order by coin flip.");
  for (const r of rows.filter(r => r.adj)) notes.push(`* ${esc(r.k)}: ${r.adj > 0 ? "+" : ""}${r.adj} point${Math.abs(r.adj) === 1 ? "" : "s"}.${r.reasons.length ? " " + esc(r.reasons.join("; ")).replace(/\.?$/, ".") : ""}`);
  if (!NON_COMPETITIVE.includes(div) && D.divs.some(d => D.games[d].some(g => g.ff))) notes.push("A forfeit is a loss for that team, and every other competitive team from the same organization loses 1 point.");
  if (D.games[div].some(g => NON_MEMBERS.includes(g.a) || NON_MEMBERS.includes(g.b))) notes.push("Games against non-conference opponents count toward the conference team's record.");
  document.getElementById("notes").innerHTML = notes.map(n => `<p class="note">${n}</p>`).join("");
}
function side(k, s, o) {
  const cls = s > o ? "win" : s < o ? "lose" : "";
  return `<div class="side ${cls}"><span class="nm">${logo(k)}${esc(k)}</span><span class="sc">${s}</span></div>`;
}
function renderGames() {
  const wk = document.getElementById("weeks"), all = D.games[div];
  const list = team ? all.filter(g => g.a === team || g.b === team) : all.filter(g => g.w === week);
  wk.hidden = !!team;
  document.getElementById("clearTeam").hidden = !team;
  document.getElementById("resultsTitle").textContent = team ? `${team} ${div} Games` : `${div} Week ${week}`;
  if (!team) wk.innerHTML = Array.from({ length: lastWeek }, (_, i) =>
    `<button class="tab wk" data-w="${i+1}" aria-pressed="${i+1 === week}">Wk ${i+1}</button>`).join("");
  const notes = !team ? D.weekNotes[div]?.[week] : null, byes = !team ? D.byes[div]?.[week] : null;
  const html = list.map(g => `<div class="game">${team ? `<span class="wkl">Week ${g.w}</span>` : ""}
      ${side(g.a, g.sa, g.sb)}${side(g.b, g.sb, g.sa)}
      ${g.sa === g.sb ? `<span class="tag">Tie</span>` : ""}
      ${g.ff ? `<span class="tag">${esc(g.ff)} forfeit${g.penalty ? "" : " · no point penalty"}</span>` : ""}
      ${NON_MEMBERS.includes(g.a) || NON_MEMBERS.includes(g.b) ? `<span class="tag">Non-conference opponent</span>` : ""}</div>`).join("")
    || `<div class="empty">${notes ? `Week ${week}: ${esc(notes.join("; "))}.` : "No games this week."}</div>`;
  document.getElementById("games").innerHTML = html + (byes ? `<p class="note">Bye: ${byes.map(esc).join(", ")}</p>` : "");
}
/* ===== Playoffs ===== */
const playoffDivs = () => D.divs.filter(d => !NO_PLAYOFFS.includes(d));
function seedsFor(d) {
  if (D.seeds[d]?.length) return { list: D.seeds[d], projected: false };
  const n = PLAYOFF_TEAMS[d] ?? PLAYOFF_TEAMS.default;
  return { list: standings(d).slice(0, n).map((r, i) => ({ seed: i + 1, team: r.k, note: r.coin ? "Tied, coin flip decides" : "" })), projected: true };
}
function bracket(d) {
  const S = seedsFor(d), rows = D.playoffs[d] || [];
  const pair = (g, x, y) => (g.a === x && g.b === y) || (g.a === y && g.b === x);
  const match = (w, p, q) => {
    const [home, away] = (p.seed ?? 99) <= (q.seed ?? 99) ? [p, q] : [q, p];
    // A game can have a schedule row (time and field, no score) plus a separate row with the final score,
    // e.g. one entered through the form. Use the latest row with a score, and keep the schedule's note.
    const exact = home.team && away.team ? rows.filter(g => g.w === w && pair(g, home.team, away.team)) : [];
    const tbd = rows.filter(g => g.w === w && ((home.team && pair(g, home.team, "TBD")) || (away.team && pair(g, away.team, "TBD"))));
    const all = exact.concat(tbd);
    const scored = exact.filter(g => g.sa != null && g.sb != null);
    let g = scored[scored.length - 1] || exact[0] || tbd[0];
    if (g && !g.note) g = { ...g, note: (all.find(x => x.note) || {}).note || "" };
    let hs = null, as = null, win = null;
    if (g && home.team && away.team && g.sa != null && g.sb != null) {
      hs = g.a === home.team ? g.sa : g.sb; as = g.a === home.team ? g.sb : g.sa;
      if (hs !== as) win = hs > as ? home : away;
    }
    return { w, home, away, hs, as, win, note: g?.note || "", ff: g?.ff || "" };
  };
  const adv = (m, label, seed) => m.win || { label, seed };
  // A seed listed twice on the Seeds tab means those two teams play a play-in game for it.
  let playin = null;
  const s = n => {
    const xs = S.list.filter(x => x.seed === n);
    if (xs.length === 2) {
      playin ??= { seed: n, m: match(9, xs[0], xs[1]) };
      return adv(playin.m, `Winner of ${xs[0].team} / ${xs[1].team} play-in`, n);
    }
    return xs[0] || { seed: n, label: `Seed #${n}` };
  };
  const rounds = { 9: [], 10: [], 11: [] }; let byes = [];
  const seedCount = new Set(S.list.map(x => x.seed)).size;
  if (seedCount >= 6) {
    const a = match(9, s(3), s(6)), b = match(9, s(4), s(5));
    rounds[9] = [a, b]; byes = [s(1), s(2)];
    rounds[10] = [match(10, s(1), adv(b, "Winner of #4 vs #5")), match(10, s(2), adv(a, "Winner of #3 vs #6"))];
  } else {
    rounds[10] = [match(10, s(1), s(4)), match(10, s(2), s(3))];
  }
  const [sf1, sf2] = rounds[10];
  rounds[11] = [match(11, adv(sf1, "Semifinal winner"), adv(sf2, "Semifinal winner"))];
  return { S, rounds, byes, playin, champ: rounds[11][0].win };
}
function pTeam(p, score, won, lost) {
  const name = p.team ? logo(p.team) + esc(p.team) : `<span class="tbd">${esc(p.label)}</span>`;
  return `<div class="pt ${won ? "win" : ""} ${lost ? "lose" : ""}">
    <span class="seed">${p.team && p.seed ? "#" + p.seed : ""}</span><span class="nm">${name}</span>
    <span class="sc">${score ?? ""}</span></div>`;
}
function metaText(m, d) {
  if (m.hs != null) return m.note ? "Final · " + m.note.replace(/^Play-in · /, "") : "Final";
  return m.note || ROUND_INFO[m.w]?.[d] || ROUND_INFO[m.w]?.["*"] || "Time and field to be announced";
}
function gameCard(m, cls, id, d) {
  return `<div class="${cls}"${id ? ` data-id="${id}"` : ""}>
    ${pTeam(m.home, m.hs, m.win === m.home, m.win && m.win !== m.home)}
    ${pTeam(m.away, m.as, m.win === m.away, m.win && m.win !== m.away)}
    ${m.ff ? `<span class="tag">${esc(m.ff)} forfeit</span>` : ""}
    <span class="pnote">${esc(metaText(m, d))}</span></div>`;
}
function seedPanel(B, d) {
  // Once a play-in has a score, the loser drops to the bottom, greyed out.
  const pi = B.playin && B.playin.m.win ? B.playin : null;
  const lost = x => pi && x.seed === pi.seed && x.team !== pi.m.win.team;
  const list = B.S.list.filter(x => !lost(x)).concat(B.S.list.filter(lost));
  return `<div class="panel seeds">${list.map(x => lost(x)
      ? `<div class="seedrow out"><span class="seed">–</span><span>${logo(x.team)}${esc(x.team)}</span><span class="tag">Lost play-in</span></div>`
      : `<div class="seedrow"><span class="seed">#${x.seed}</span><span>${logo(x.team)}${esc(x.team)}</span>${x.note ? `<span class="mark">†</span>` : ""}</div>`).join("")}</div>
    <div class="notes">
      <p class="note">${B.S.projected ? "Seeds are projected from the regular-season standings until the conference confirms them." : "Seeds as set by the conference."} The higher seed is listed first and is the home team.</p>
      ${[...new Set(B.S.list.filter(x => x.note).map(x => x.note))].map(n => `<p class="note">† ${esc(n)}: ${B.S.list.filter(x => x.note === n).map(x => esc(x.team)).join(", ")}</p>`).join("")}
      ${SEED_NOTES[d] ? `<p class="note"><strong>${esc(SEED_NOTES[d])}</strong></p>` : ""}
    </div>`;
}
/* Age-group page: seeds plus a bracket graphic */
function renderPlayoffAge() {
  const B = bracket(div), el = document.getElementById("secPlayoffs");
  const cols = [], links = [];
  if (B.playin) { cols.push({ title: "Play-in", date: "", games: [["pi", B.playin.m]] }); }
  if (B.rounds[9].length) {
    const [a, b] = B.rounds[9];                     // a = #3 v #6, b = #4 v #5
    cols.push({ w: 9, games: B.playin ? [["r1a", a], ["r1b", b]] : [["r1b", b], ["r1a", a]] });
    links.push(["r1b", "sf1"], ["r1a", "sf2"]);
    if (B.playin) links.push(["pi", B.playin.seed === 6 || B.playin.seed === 3 ? "r1a" : "r1b"]);
  }
  cols.push({ w: 10, games: [["sf1", B.rounds[10][0]], ["sf2", B.rounds[10][1]]] });
  cols.push({ w: 11, games: [["f", B.rounds[11][0]]] });
  links.push(["sf1", "f"], ["sf2", "f"]);
  el.innerHTML = `<h2>${esc(div)} Playoffs</h2>
    <h3 class="sechead">Seeding</h3>${seedPanel(B, div)}
    <hr class="divider">
    <h3 class="sechead">Games</h3>
    <p class="swipe">Swipe the bracket sideways to see every round →</p>
    <div class="bwrap"><div class="bracket" id="bracket" style="--cols: ${cols.length}">
      ${cols.map(c => `<div class="bcol"><div class="bhead">${c.title || ROUNDS[c.w]}<span>${esc(c.date ?? ROUND_DATES[c.w] ?? "")}</span></div>
        <div class="bgames">${c.games.map(([id, m]) => gameCard(m, "bg", id, div)).join("")}</div></div>`).join("")}
      <svg class="blines" aria-hidden="true"></svg>
    </div></div>
    ${B.byes.length ? `<p class="note">First-round byes: ${B.byes.map(b => `#${b.seed} ${esc(b.team || b.label)}`).join(", ")}</p>`
      : `<p class="note">No first-round games. The top 4 teams go straight to the semifinals.</p>`}
    ${B.champ ? `<div class="champ">${esc(div)} Champion: ${esc(B.champ.team)}</div>` : ""}`;
  el.dataset.links = JSON.stringify(links);
  drawLines();
}
function drawLines() {
  const bk = document.getElementById("bracket"), el = document.getElementById("secPlayoffs");
  if (!bk || el.hidden) return;
  const svg = bk.querySelector(".blines"), box = bk.getBoundingClientRect();
  svg.setAttribute("width", bk.scrollWidth); svg.setAttribute("height", bk.scrollHeight);
  const pos = id => { const r = bk.querySelector(`[data-id="${id}"]`)?.getBoundingClientRect(); return r && { l: r.left - box.left, r: r.right - box.left, y: r.top - box.top + r.height / 2 }; };
  svg.innerHTML = JSON.parse(el.dataset.links || "[]").map(([f, t]) => {
    const a = pos(f), b = pos(t); if (!a || !b) return "";
    const x = (a.r + b.l) / 2;
    return `<path d="M${a.r} ${a.y} H${x} V${b.y} H${b.l}" />`;
  }).join("");
}
/* Round page: every division's games for one round */
let pround = 9;
function renderPlayoffRound() {
  const el = document.getElementById("secPlayoffs");
  let html = `<h2>${ROUNDS[pround]}<span class="h2date">${esc(ROUND_DATES[pround] || "")}</span></h2>`;
  if (ROUND_EXTRAS[pround]) html += `<div class="pgame extra">${esc(ROUND_EXTRAS[pround])}</div>`;
  for (const d of playoffDivs()) {
    const B = bracket(d), ms = B.rounds[pround];
    html += `<div class="round"><h3>${esc(d)}</h3>`;
    if (pround === 9 && B.playin) html += `<span class="pnote">Play-in game</span>` + gameCard(B.playin.m, "pgame", null, d);
    if (!ms.length) html += `<div class="empty">No first-round games in ${esc(d)}. The top 4 teams go straight to the semifinals.${SEED_NOTES[d] ? " " + esc(SEED_NOTES[d]) : ""}</div>`;
    else html += ms.map(m => gameCard(m, "pgame", null, d)).join("");
    if (pround === 9 && B.byes.length) html += `<p class="note">Byes: ${B.byes.map(b => `#${b.seed} ${esc(b.team || b.label)}`).join(", ")}</p>`;
    html += `</div>`;
  }
  el.innerHTML = html;
}
let pview = "age";
let seasonLabel = "";
function renderMode() {
  document.getElementById("mode").hidden = !SHOW_PLAYOFFS;
  if (!SHOW_PLAYOFFS) mode = "season";
  const isPo = mode === "playoffs";
  document.body.classList.toggle("po-mode", isPo);
  document.getElementById("title").textContent = isPo ? "Playoffs" : "Regular Season";
  document.getElementById("updated").textContent = isPo
    ? `First round ${ROUND_DATES[9]} · Semifinals ${ROUND_DATES[10]} · Super Bowl ${ROUND_DATES[11].split(" · ")[0]}`
    : seasonLabel;
  document.title = (isPo ? "Playoffs" : "Standings") + " · RISMA Pop Warner";
  for (const b of document.querySelectorAll("#mode button")) b.setAttribute("aria-pressed", b.dataset.m === mode);
  for (const b of document.querySelectorAll("#pview button")) b.setAttribute("aria-pressed", b.dataset.v === pview);
  const po = mode === "playoffs", byRound = po && pview === "round";
  document.getElementById("pview").hidden = !po;
  document.getElementById("rounds").hidden = !byRound;
  document.getElementById("divs").hidden = byRound;
  document.getElementById("secPlayoffs").hidden = !po;
  document.querySelector(".wrap").classList.toggle("wide", po && pview === "age");
  document.getElementById("secStand").hidden = po;
  document.getElementById("secGames").hidden = po;
  document.getElementById("rounds").innerHTML = Object.entries(ROUNDS).map(([w, n]) =>
    `<button class="tab" data-r="${w}" aria-pressed="${+w === pround}">${n}</button>`).join("");
}
function renderAll() {
  renderTabs(); renderMode();
  if (mode !== "playoffs") { renderStandings(); renderGames(); }
  else if (pview === "round") renderPlayoffRound();
  else renderPlayoffAge();
}

function start(scoresText, adjText, label, seedsText) {
  D = build(scoresText, adjText, seedsText);
  mode = SHOW_PLAYOFFS ? START_VIEW : "season";
  if (!D.divs.length) { document.getElementById("updated").textContent = "No scores yet."; return; }
  lastWeek = Math.max(...D.divs.flatMap(d => D.games[d].map(g => g.w)));
  week = lastWeek;
  let saved = null; try { saved = localStorage.getItem("risma-div"); } catch (e) {}
  div = D.divs.includes(saved) ? saved : D.divs[0];
  const total = D.divs.reduce((n, d) => n + D.games[d].length, 0);
  seasonLabel = `Final standings through Week ${lastWeek} · ${total} games across ${D.divs.length} divisions${label ? " · " + label : ""}`;
  renderAll();
}

async function load() {
  if (SCORES_CSV) {
    try {
      const bust = (u) => u + (u.includes("?") ? "&" : "?") + "t=" + Date.now();
      const opt = u => u ? fetch(bust(u), { cache: "no-store" }).then(r => r.ok ? r.text() : "").catch(() => "") : Promise.resolve("");
      const [s, a, sd, st] = await Promise.all([
        fetch(bust(SCORES_CSV), { cache: "no-store" }).then(r => { if (!r.ok) throw r.status; return r.text(); }),
        opt(ADJUSTMENTS_CSV), opt(SEEDS_CSV), opt(SETTINGS_CSV)
      ]);
      // Safety check: each link must point at the right tab. A wrong or broken link falls back to the saved copy.
      const head = t => (t || "").split(/\r?\n/)[0].toLowerCase();
      const has = (t, cols) => cols.every(c => head(t).includes(c));
      if (has(st, ["setting", "value"])) { try { applySettings(st); } catch (err) {} }
      if (!has(s, ["week", "division", "team 1", "score 1"])) throw "Scores link is not the Scores tab";
      const a2 = has(a, ["division", "team", "points"]) ? a : (FALLBACK ? FALLBACK.Adjustments : "");
      const sd2 = has(sd, ["division", "seed", "team"]) ? sd : (FALLBACK ? FALLBACK.Seeds : "");
      if (!build(s, a2, sd2).divs.length) throw "Scores tab came back empty";
      start(s, a2, "", sd2);
      return;
    } catch (e) {
      const b = document.getElementById("banner");
      b.textContent = `Couldn't reach the score sheet just now, so this shows the saved copy from ${FALLBACK_DATE}. Refresh to try again.`;
      b.hidden = false;
    }
  }
  if (FALLBACK) start(FALLBACK.Scores, FALLBACK.Adjustments, "", FALLBACK.Seeds);
}

document.querySelector("#secStand thead").addEventListener("click", e => {
  const th = e.target.closest("th[data-sort]"); if (!th) return;
  const k = th.dataset.sort;
  if (sortCol === k) sortDir = sortDir === "desc" ? "asc" : "desc";
  else { sortCol = k; sortDir = (k === "team" || k === "l" || k === "pa") ? "asc" : "desc"; }
  renderStandings();
});
document.getElementById("resetSort").addEventListener("click", () => { sortCol = null; renderStandings(); });
document.getElementById("pview").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return; pview = b.dataset.v; renderAll();
});
document.getElementById("rounds").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return; pround = +b.dataset.r; renderAll();
});
window.addEventListener("resize", drawLines);
document.fonts?.ready?.then(drawLines);
document.getElementById("mode").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  mode = b.dataset.m; team = null; renderAll();
});

document.getElementById("divs").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  div = b.dataset.d; team = null; sortCol = null;
  try { localStorage.setItem("risma-div", div); } catch (err) {}
  renderAll();
});
document.getElementById("standings").addEventListener("click", e => {
  const tr = e.target.closest("tr"); if (!tr) return;
  team = team === tr.dataset.k ? null : tr.dataset.k; renderStandings(); renderGames();
});
document.getElementById("standings").addEventListener("keydown", e => {
  if (e.key === "Enter" || e.key === " ") { e.preventDefault(); e.target.closest("tr")?.click(); }
});
document.getElementById("weeks").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return; week = +b.dataset.w; renderGames();
});
document.getElementById("clearTeam").addEventListener("click", () => { team = null; renderStandings(); renderGames(); });
load();
</script>
